name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, budgets, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests, with coverage gates
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Asset and bundle budgets are checked against the built output, so this
      # has to come after the build.
      - name: Budgets
        run: npm run check:budgets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Functional flows, the mobile disclosure model, the viewport matrix,
      # axe, and the performance/architecture assertions.
      #
      # The visual-regression projects are deliberately NOT in this job: their
      # baselines are per-platform bitmaps and this repository carries only the
      # ones generated during the repair. Run `npm run test:visual` (and
      # `npm run test:visual:update` after an intentional design change) on the
      # platform whose baselines are committed.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-measurements
          path: docs/repair/final/
          retention-days: 30

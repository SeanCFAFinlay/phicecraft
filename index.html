<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale / user-scalable=no: disabling browser zoom is a
      WCAG 1.4.4 failure and makes the rink unusable for anyone who needs to
      magnify it. viewport-fit=cover is kept, and the safe-area insets it
      exposes are handled in CSS.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#06101a" />
    <meta name="description" content="Design, animate and review hockey drills on a full-size rink. Works offline on phone, tablet and desktop." />
    <title>PhiceCraft - Hockey Drill Designer</title>
    <link rel="icon" type="image/svg+xml" href="/hockey-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
